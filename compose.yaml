services:
  shipmenttracker:
    image: shipmenttracker
    build:
      context: .
      dockerfile: ShipmentTracker/Dockerfile
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shipment_tracker
      POSTGRES_USER: shipment_user
      POSTGRES_PASSWORD: shipment_password
    ports:
      - "5432:5432"
    volumes:
      - shipment_postgres_data:/var/lib/postgresql/data
    
volumes:
  shipment_postgres_data:

